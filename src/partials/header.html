<header class="site-header" id="site-header">
  <div class="nav wrap">
    <a class="brand" href="{{root}}" aria-label="SPY-D Studio home">{{partial_lockup}}</a>
    <nav class="nav-links" aria-label="Main">
{{navDesktop}}
    </nav>
    <div class="nav-actions">
      <a class="btn btn-primary btn-sm" href="{{root}}contact/">Start a project <span class="arrow" aria-hidden="true">→</span></a>
      <button class="icon-btn menu-open" id="menu-open" type="button" aria-label="Open menu" aria-controls="mobile-menu" aria-expanded="false">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M3 7h18M3 12h18M3 17h18" stroke="currentColor" stroke-width="2" fill="none"/></svg>
      </button>
    </div>
  </div>
</header>
<dialog class="mobile-menu" id="mobile-menu" aria-label="Menu">
  <div class="menu-bar">
    <a class="brand" href="{{root}}" aria-label="SPY-D Studio home">{{partial_lockup_reverse}}</a>
    <button class="icon-btn" id="menu-close" type="button" aria-label="Close menu">
      <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M5 5l14 14M19 5L5 19" stroke="currentColor" stroke-width="2" fill="none"/></svg>
    </button>
  </div>
  <nav class="menu-links" aria-label="Mobile">
    <a class="menu-link" href="{{root}}">Home</a>
{{navMobile}}
    <a class="menu-link" href="{{root}}contact/">Contact</a>
  </nav>
  <div class="menu-footer">
    <a class="btn btn-primary" href="{{root}}contact/">Start a project <span aria-hidden="true">→</span></a>
    <a class="btn btn-ghost" href="{{whatsappUrl}}" target="_blank" rel="noopener">WhatsApp {{phoneDisplay}}</a>
  </div>
</dialog>
