<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}}</title>
<meta name="description" content="{{description}}">
{{noindex}}<link rel="canonical" href="{{canonical}}">
<meta name="theme-color" content="#FFF7EC">
<meta property="og:type" content="website">
<meta property="og:site_name" content="{{name}}">
<meta property="og:title" content="{{title}}">
<meta property="og:description" content="{{description}}">
<meta property="og:url" content="{{canonical}}">
<meta property="og:image" content="{{ogImage}}">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="{{title}}">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="{{root}}assets/img/favicon.svg" type="image/svg+xml">
<link rel="manifest" href="{{root}}site.webmanifest">
<link rel="preload" href="{{root}}assets/fonts/nunito-sans-latin-900-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="{{root}}assets/fonts/nunito-sans-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
{{preload}}<link rel="stylesheet" href="{{root}}assets/css/tokens.css">
<link rel="stylesheet" href="{{root}}assets/css/base.css">
<link rel="stylesheet" href="{{root}}assets/css/components.css">
{{extraCss}}<script src="{{root}}assets/js/config.js" defer></script>
<script src="{{root}}assets/js/site.js" defer></script>
{{extraJs}}{{jsonld}}<script type="speculationrules">{"prerender":[{"where":{"and":[{"href_matches":"{{basePath}}*"},{"not":{"selector_matches":"[target], [download], [rel~=nofollow]"}}]},"eagerness":"moderate"}]}</script>

</head>
<body class="{{pageClass}}">
<a class="skip-link" href="#main">Skip to content</a>
{{partial_header}}
<main id="main">
{{content}}
</main>
{{partial_footer}}
<aside class="wa-dock" aria-label="Quick contact"><a class="wa-float" href="{{whatsappUrl}}" target="_blank" rel="noopener" aria-label="Chat with SPY-D Studio on WhatsApp">{{partial_whatsapp}}<span class="wa-label" aria-hidden="true">Chat with us</span></a></aside>
</body>
</html>
